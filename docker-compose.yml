version: '3.8'
services:
  
  db:
    image: mysql:8.0
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      # MYSQL_ROOT_PASSWORD: rootpassword
      # MYSQL_USER: name
      # MYSQL_PASSWORD: password
      # MYSQL_DATABASE: laravel
    ports:
      - 3306:3306
    volumes:
      - mysqldatadir:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
  
  php-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: moaaz65/laravel-image
    container_name: laravel-app
    # volumes:
    #   - /var/lib/jenkins/workspace/Laravel-first-job:/var/www/html
    ports:
      - 5000:80
    environment:
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - /var/lib/jenkins/workspace/Laravel-first-job/.env
  
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "4000:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

volumes:
  mysqldatadir: